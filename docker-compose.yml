name: musicweb

services:
  mysql:
    image: mysql:8.4
    container_name: musicweb-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-musicweb}
      MYSQL_USER: ${DB_USER:-musicweb}
      MYSQL_PASSWORD: ${DB_PASSWORD:-musicweb_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-musicweb_root_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-allowed-packet=512M
    ports:
      - "${MYSQL_PUBLIC_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Data/musicweb.sql:/docker-entrypoint-initdb.d/01-musicweb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: musicweb-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PUBLIC_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qq-api:
    image: musicweb-qq-api:latest
    build:
      context: ./Project/MusicWeb/src/main/webapp/MusicServer/qq_api
      dockerfile: Dockerfile
    container_name: musicweb-qq-api
    environment:
      SECRETS_FILE: /app/secrets.txt
      API_CREDENTIALS_FILE: /app/Cookie/api_credentials.json
      QQ_CREDENTIAL_DIR: /app/credentials
      NETEASE_API_URL: http://music-api:3000
    ports:
      - "${QQ_API_PUBLIC_PORT:-8000}:8000"
    volumes:
      - ./docker/private/secrets.txt:/app/secrets.txt:ro
      - ./docker/private/api_credentials.json:/app/Cookie/api_credentials.json:ro
      - ./docker/private/qq_credentials:/app/credentials
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 20

  unblock:
    image: musicweb-unblock:latest
    build:
      context: ./Project/MusicWeb/src/main/webapp/MusicServer/unblock
      dockerfile: Dockerfile
    container_name: musicweb-unblock
    command: ["-p", "8081"]
    ports:
      - "${UNBLOCK_PUBLIC_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8081', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  music-api:
    image: musicweb-music-api:latest
    build:
      context: ./Project/MusicWeb/src/main/webapp
      dockerfile: Dockerfile.music-api
    container_name: musicweb-music-api
    environment:
      QQ_API_URL: http://qq-api:8000
      UNBLOCK_API_URL: http://unblock:8081
      MUSIC_API_COOKIE_FILE: /app/src/main/webapp/MusicServer/Cookie/api_credentials.json
    ports:
      - "${MUSIC_API_PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./docker/private/api_credentials.json:/app/src/main/webapp/MusicServer/Cookie/api_credentials.json:ro
    depends_on:
      qq-api:
        condition: service_healthy
      unblock:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  musicweb:
    image: musicweb-web:latest
    build:
      context: ./Project/MusicWeb
      dockerfile: Dockerfile
    container_name: musicweb-web
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MUSIC_API_URL: http://music-api:3000
      QQ_API_URL: http://qq-api:8000
      TZ: Asia/Shanghai
    ports:
      - "${MUSICWEB_PUBLIC_PORT:-8082}:8082"
    volumes:
      - ./docker/private/secrets.txt:/app/Project/MusicWeb/secrets.txt:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      music-api:
        condition: service_healthy

  recommender:
    image: musicweb-recommender:latest
    build:
      context: ./Project/MusicMode
      dockerfile: Dockerfile
    container_name: musicweb-recommender
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    volumes:
      - ./docker/private/secrets.txt:/app/secrets.txt:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
