# MusicWeb 音乐 API 配置
# Music API Configuration for MusicWeb

# Node.js API 服务地址
music.api.url=http://localhost:3000

# API 请求超时时间（毫秒）
music.api.connect.timeout=5000
music.api.read.timeout=10000

# 默认音乐源 (netease)
music.default.source=netease

# 启用的音乐平台
music.sources.enabled=netease,qq

# 搜索结果默认数量
music.search.limit=30
