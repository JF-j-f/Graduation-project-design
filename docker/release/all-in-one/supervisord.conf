[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --save "" --appendonly no
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qq-api]
directory=/opt/musicweb/Project/MusicWeb/src/main/webapp/MusicServer/qq_api
command=/opt/musicweb/venv-qq/bin/python -m uvicorn app:app --host 0.0.0.0 --port 8000
environment=SECRETS_FILE="/opt/musicweb/runtime-config/secrets.txt",API_CREDENTIALS_FILE="/opt/musicweb/runtime-config/api_credentials.json",QQ_CREDENTIAL_DIR="/opt/musicweb/runtime-config/qq_credentials",NETEASE_API_URL="http://127.0.0.1:3000"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:unblock]
directory=/opt/musicweb/Project/MusicWeb/src/main/webapp/MusicServer/unblock
command=node src/app.js -p 8081
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:music-api]
directory=/opt/musicweb/Project/MusicWeb/src/main/webapp/MusicServer
command=node ../js/server.js
environment=QQ_API_URL="http://127.0.0.1:8000",UNBLOCK_API_URL="http://127.0.0.1:8081",MUSIC_API_COOKIE_FILE="/opt/musicweb/runtime-config/api_credentials.json"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:musicweb]
directory=/opt/musicweb/Project/MusicWeb
command=mvn -DskipTests cargo:run
environment=DB_HOST="127.0.0.1",DB_PORT="3306",REDIS_HOST="127.0.0.1",REDIS_PORT="6379",MUSIC_API_URL="http://127.0.0.1:3000",QQ_API_URL="http://127.0.0.1:8000",SECRETS_FILE="/opt/musicweb/runtime-config/secrets.txt"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
